services:
  hopp-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hopp-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MAX_PAYLOAD_MB=15
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped

  hopp-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hopp-web
    ports:
      - "80:80"
    depends_on:
      - hopp-server
    restart: unless-stopped
